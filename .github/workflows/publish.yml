name: Publish Compressor 1.1
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - Compressor-1.1.apk
      - Compressor-1.1.sha256
      - .github/workflows/publish.yml
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release APK checksum
        run: sha256sum -c Compressor-1.1.sha256
      - name: Upload and publish Compressor 1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload v1.1.0 Compressor-1.1.apk Compressor-1.1.sha256 --clobber
          gh release edit v1.1.0 --draft=false --prerelease=false --latest --title 'Compressor 1.1'
